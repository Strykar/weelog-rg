[project]
name = "weelog-hindsight"
version = "0.1.0"
description = "Fast TUI search over WeeChat IRC logs, powered by ripgrep."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["weechat", "irc", "logs", "tui", "ripgrep", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pylint>=3",
]

[project.urls]
Homepage = "https://github.com/strykar/weelog-hindsight"
Issues = "https://github.com/strykar/weelog-hindsight/issues"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["slow: long-running fuzz tests (~30s per seed)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PERF"]
ignore = [
    "E501",  # long lines: CSS and help literals are clearer unwrapped
]
